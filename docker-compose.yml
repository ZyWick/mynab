services:
  db:
    image: postgres:16-alpine
    container_name: my-ynab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ynab
      POSTGRES_PASSWORD: ynab
      POSTGRES_DB: ynab
    ports:
      - "5432:5432"
    volumes:
      - ynab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ynab -d ynab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ynab_pgdata:
