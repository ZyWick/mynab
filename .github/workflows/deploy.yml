name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: my-ynab
  PROD_SECRET_ID: my-ynab/prod

permissions:
  id-token: write    # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          SHA="${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fetch prod secret
        id: secret
        run: |
          set -euo pipefail
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$PROD_SECRET_ID" \
            --query SecretString --output text)
          # Convert JSON {"K":"V"} to KEY=VALUE lines, base64 for safe transport via SSM
          ENV_B64=$(echo "$SECRET_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print('\n'.join(f'{k}={v}' for k,v in d.items()))" | base64 -w0)
          echo "::add-mask::$ENV_B64"
          echo "env_b64=$ENV_B64" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          ENV_B64: ${{ steps.secret.outputs.env_b64 }}
        run: |
          set -euo pipefail
          COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)
          REGISTRY="${IMAGE_URI%%/*}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy my-ynab ${GITHUB_SHA::7}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"mkdir -p /opt/my-ynab\",
              \"cd /opt/my-ynab\",
              \"echo ${COMPOSE_B64} | base64 -d > docker-compose.prod.yml\",
              \"umask 077 && echo ${ENV_B64} | base64 -d > .env\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}\",
              \"export IMAGE=${IMAGE_URI}\",
              \"docker compose -f docker-compose.prod.yml up -d --pull always\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "Status: $STATUS"

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          [ "$STATUS" = "Success" ]
